# ===== Toolkit =====

# Интервал обновления HUD (экранного вывода) в тиках (20 тиков = 1 секунда)
hud:
  interval-ticks: 2
  # Скрывать координаты из экрана отладки F3 (gamerule reducedDebugInfo)
  hide-f3-coordinates: true

# Компас
# - Обычный компас в руке показывает ваши координаты.
# - Привязанный к магниту (lodestone) компас координаты не показывает.
# - Чтобы отслеживать игрока: сначала ПКМ по магниту (привязка), затем ПКМ по игроку.
# - Невидимого игрока отслеживать нельзя.
# - Компас работает только в мире магнита: в других измерениях стрелка крутится
#   (как у компаса, потерявшего магнит), даже если цель рядом.
# - Стрелка указывает на позицию игрока на момент последнего ПКМ-обновления
#   (по игроку или в воздухе); остаток перезарядки виден в HUD рядом с целью.
# - Если магнит сломают — компас сбросится полностью.
compass:
  enabled: true
  # Перезарядка обновления метки (в секундах)
  cooldown-seconds: 60

# Часы: показ времени и времени до перемотки дня/ночи (через TimeSpeed-plugin)
clock:
  enabled: true

# Дебагстик (стол кузнеца: палка + звезда Незера)
# - ПКМ по блоку — изменить значение выбранного свойства (шифт — в обратную сторону).
# - ЛКМ по блоку — выбрать следующее свойство, блок не ломается.
# - Шифт+ЛКМ — скопировать состояние блока (пипетка).
# - ПКМ — применить скопированное состояние к такому же блоку.
debug-stick:
  enabled: true
  # Сколько использований у дебагстика
  uses: 250
  # Отображаемое имя палочки отладки
  name: "Палочка отладки"

# Невидимые рамки: 8 рамок + зелье невидимости = 8 невидимых рамок
frames:
  invisible-enabled: true
  invisible-name: "Невидимая рамка"

# Шлем-флаг: шифт+ПКМ с флагом в руке надевает его на голову
banner-hat:
  enabled: true

# Запрет полёта на элитрах в огне
fire-elytra:
  enabled: true

# Котёл по-Bedrock: окрашивание брони, очистка флагов и шалкеров
# - ПКМ по котлу с водой с краской → окрасить кожаную броню
# - ПКМ по котлу с водой без краски → очистить окрашенную броню/флаг/шалкер
# - ПКМ по котлу с краской → очистить окрашенную броню
# - Добавление краски: ПКМ по котлу с краской в руке
cauldron-bedrock:
  enabled: true

# Пересадка попугая с плеча
# - Шифт + ПКМ по блоку пересаживает попугая с плеча на блок
parrot-transplant:
  enabled: true

# Дополнительные зачарования на щите
# - Шипы: атакующий получает урон при блокировке
# - Отбрасывание: усиленное отбрасывание атакующих и снарядов
# - Быстрая перезарядка: щит перезаряжается быстрее
# - Работают через наковальню (книга зачарования + щит)
shield-enchant:
  enabled: true

# Отравленные стрелы в ловушке храма джунглей
# - Стрелы, выпущенные диспенсером в храме джунглей, получают эффект яда
jungle-temple-arrows:
  enabled: true

# Снежные големы замораживают снежками
# - Попадание снежка накладывает эффект заморозки как рыхлый снег
snow-golem-freeze:
  enabled: true

# Проклятье утраты для мешков
# - Мешки можно зачаровать проклятием утраты через наковальню
bundle-vanishing:
  enabled: true

# Шлемы поглощают урон булавы (трезубца)
# - Все шлемы поглощают 25% урона от булавы, теряя прочность
# - Черепаший панцирь поглощает 50% и теряет в 2 раза меньше прочности
turtle-helm-trident:
  enabled: true

# Увеличенный спавн животных (аналог NotEnoughAnimals)
# - При загрузке чанка с шансом spawning-chunk-chance спавнятся животные по правилам биомов.
# - Животные, помеченные плагином, despawn'ятся при выгрузке чанка, если не одомашнены
#   (накормлены, разведены, с поводком, с именем и т.д.).
# - Список spawn-rules: environments (NORMAL/NETHER/THE_END), biomes, on-top-of (материал или #тег), types
animal-spawning:
  enabled: true
  spawning-chunk-chance: 0.65
  spawn-tries:
    min: 1
    max: 5
  spawn-rules:
    - environments: [NORMAL]
      biomes: [PLAINS, SUNFLOWER_PLAINS]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [COW, SHEEP, PIG, CHICKEN, HORSE, DONKEY]
    - environments: [NORMAL]
      biomes: [FOREST, FLOWER_FOREST, BIRCH_FOREST, OLD_GROWTH_BIRCH_FOREST]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [SHEEP, PIG, CHICKEN, COW, WOLF]
    - environments: [NORMAL]
      biomes: [DARK_FOREST]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [SHEEP, PIG, CHICKEN, COW]
    - environments: [NORMAL]
      biomes: [TAIGA, OLD_GROWTH_PINE_TAIGA, OLD_GROWTH_SPRUCE_TAIGA]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [WOLF, FOX, RABBIT, SHEEP, PIG, CHICKEN, COW]
    - environments: [NORMAL]
      biomes: [SNOWY_TAIGA]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [WOLF, FOX, RABBIT, SHEEP, PIG, CHICKEN, COW]
    - environments: [NORMAL]
      biomes: [SNOWY_PLAINS, SNOWY_SLOPES, ICE_SPIKES]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [POLAR_BEAR, RABBIT, FOX]
    - environments: [NORMAL]
      biomes: [GROVE, FROZEN_PEAKS, JAGGED_PEAKS]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [RABBIT, FOX, GOAT]
    - environments: [NORMAL]
      biomes: [STONY_PEAKS, WINDSWEPT_HILLS, WINDSWEPT_GRAVELLY_HILLS]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [GOAT, SHEEP, LLAMA]
    - environments: [NORMAL]
      biomes: [WINDSWEPT_FOREST]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [SHEEP, PIG, CHICKEN, COW, LLAMA]
    - environments: [NORMAL]
      biomes: [MEADOW]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [DONKEY, SHEEP, RABBIT]
    - environments: [NORMAL]
      biomes: [CHERRY_GROVE]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [SHEEP, PIG, CHICKEN, BEE]
    - environments: [NORMAL]
      biomes: [JUNGLE, BAMBOO_JUNGLE, SPARSE_JUNGLE]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [CHICKEN, OCELOT, PARROT, PANDA]
    - environments: [NORMAL]
      biomes: [SAVANNA, SAVANNA_PLATEAU, WINDSWEPT_SAVANNA]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [HORSE, DONKEY, SHEEP, COW, PIG, CHICKEN]
    - environments: [NORMAL]
      biomes: [DESERT]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [RABBIT]
    - environments: [NORMAL]
      biomes: [SWAMP, MANGROVE_SWAMP]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [FROG]
    - environments: [NORMAL]
      biomes: [MUSHROOM_FIELDS]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [MOOSHROOM]
    - environments: [NORMAL]
      biomes: [BEACH, SNOWY_BEACH, STONY_SHORE]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [TURTLE]

# Невидимый свет: 4 пыльки светокамня + стекло = 4 факела-источника невидимого света
# - ПКМ в воздухе — изменить уровень яркости (1-15), шифт+ПКМ — уменьшить
# - ПКМ по блоку — поставить невидимый свет с текущим уровнем яркости
light:
  enabled: true
  # Уровень яркости по умолчанию при крафте (1-15)
  default-level: 15
  # Отображаемое имя предмета
  name: "Невидимый свет"

# Обфускация координат (защита от карт/читов по координатам)
# - Требует установленный плагин PacketEvents (https://modrinth.com/plugin/packetevents).
# - Мир для клиента сдвигается на случайный оффсет: клиент видит координаты,
#   сдвинутые относительно реальных (fake = real - offset).
# - Оффсет кратен 8 чанкам (128 блокам), чтобы в Нижнем мире (деление на 8)
#   он оставался кратным чанку. В Энде оффсет совпадает с обычным миром.
# - Компас в руке показывает в action bar РЕАЛЬНЫЕ координаты игрока (намеренно,
#   для своих) — они не смещаются обфускацией.
# - Привязанный к игроку компас Toolkit работает: магнит (метка цели) смещается
#   на тот же оффсет, что и позиция держателя, поэтому стрелка указывает корректно.
coord-offset:
  enabled: true
  # Максимальный сдвиг в чанках (0 = без сдвига). 128 чанков = 2048 блоков
  range-chunks: 128
  # Постоянный оффсет для игрока между заходами (по UUID).
  # true = один и тот же оффсет при каждом заходе; false = новый случайный оффсет при каждом заходе
  persistent: true
  # Игроки с этим правом видят реальные координаты
  bypass-permission: "toolkit.coordoffset.bypass"
  # Совместимость с модом Axiom (перевод координат в его пакетах).
  # true = строительство в Axiom работает корректно при включённой обфускации
  axiom-fix: true

# Координаты смерти
# - При смерти игроку в чат отправляются координаты его смерти
#   (реальные, как у компаса в руке — обфускацией не сдвигаются).
# - Каждый игрок может включить/выключить уведомления отдельно:
#   /deathcoords on / /deathcoords off (настройка запоминается между заходами).
# - /deathcoords (или /deathcoords show) — снова показать координаты последней смерти.
death-coords:
  enabled: true
  # Значение по умолчанию для нового игрока (до его команды on/off)
  default-enabled: true
  message: "☠ Координаты смерти: X: %d, Y: %d, Z: %d (%s)"
  no-death: "У вас ещё нет записи о смерти"
  on: "Уведомления о координатах смерти включены"
  off: "Уведомления о координатах смерти выключены"
  usage: "Использование: /deathcoords <on|off|show>"

# Сообщения (%s = подстановка). Также можно перевести на другие языки
# файлами в lang/ — они берутся из локали игрока.
messages:
  # Компас
  compass: "Компас"
  coords: "Координаты:"
  tracking: "Цель: %s"
  tracking-offline: "Цель оффлайн"
  tracking-lost: "Цель в другом мире"
  distance: " · %s м"
  cooldown: " · %s с"
  target-invisible: "Нельзя отслеживать невидимого игрока"
  time-label: "Время"
  time: "Время: %s"
  to-night: "До ночи: %s"
  to-morning: "До утра: %s"
  to-morning-fast: "До утра: %s (x%.1f)"
  need-magnet: "Сначала привяжи компас к магниту (ПКМ по магниту)"
  magnet-broken: "Магнит сломан — отслеживание сброшено"
  unbound: "Отслеживание и магнит сняты"

  # Котёл
  cauldron: "Котёл"
  water-filled: "Вода"
  potion-added: "Зелье добавлено"
  potion-mixed: "Зелья смешаны"
  potion-full: "Макс. 3 зелья"
  potion-taken: "Зелье забрано"
  arrows-tipped: "Стрелы пропитаны"
