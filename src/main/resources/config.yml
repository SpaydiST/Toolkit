# ===== Toolkit =====

# Цвета оформления (#RRGGBB). Применяются после /toolkit reload.
colors:
  # Акцентный цвет: префиксы, значения, подсветки
  accent: "#55FF55"
  # Цвет ошибок и предупреждений
  error: "#E74C3C"
  # Приглушённый текст (подписи, лишние данные)
  dim: "#AAAAAA"
  # Разделители (пробелы, " = ")
  separator: "#555555"

# Интервал обновления HUD (экранного вывода) в тиках (20 тиков = 1 секунда)
hud:
  interval-ticks: 2
  # Скрывать координаты из экрана отладки F3 (gamerule reducedDebugInfo)
  hide-f3-coordinates: true

# Компас
# - Обычный компас в руке показывает ваши координаты.
# - Привязанный к магниту (lodestone) компас координаты не показывает.
# - Чтобы отслеживать игрока: сначала ПКМ по магниту (привязка), затем ПКМ по игроку.
# - Невидимого игрока отслеживать нельзя.
# - Компас работает только в мире магнита: в других измерениях стрелка крутится
#   (как у компаса, потерявшего магнит), даже если цель рядом.
# - Стрелка указывает на позицию игрока на момент последнего ПКМ-обновления
#   (по игроку или в воздухе); остаток перезарядки виден в HUD рядом с целью.
# - Если магнит сломают — компас сбросится полностью.
compass:
  enabled: true
  # Перезарядка обновления метки (в секундах)
  cooldown-seconds: 60

# Часы: показ времени и времени до перемотки дня/ночи (через TimeSpeed-plugin)
clock:
  enabled: true

# Дебагстик (стол кузнеца: палка + звезда Незера)
# - ПКМ по блоку — изменить значение выбранного свойства (шифт — в обратную сторону).
# - ЛКМ по блоку — выбрать следующее свойство, блок не ломается.
# - Шифт+ЛКМ — скопировать состояние блока (пипетка).
# - ПКМ — применить скопированное состояние к такому же блоку.
debug-stick:
  enabled: true
  # Сколько использований у дебагстика
  uses: 250
  # Отображаемое имя палочки отладки
  name: "Палочка отладки"

# Невидимые рамки: 1 мембрана фантома + 1 рамка = 1 невидимая рамка
# - Пустая рамка видна настоящей моделью рамки, с предметом — полностью невидимая
#   (предмет просто «парит» на месте рамки)
frames:
  invisible-enabled: true
  invisible-name: "Невидимая рамка"

# Шлем-флаг: шифт+ПКМ в воздухе с флагом в руке надевает его на голову
banner-hat:
  enabled: true

# ТНТ-шлем: шлем + ТНТ (бесформенный крафт). При получении урона шлем взрывается.
# - name/lore применяются к новым предметам (уже выданные не меняются)
# - yield: сила взрыва (у обычного ТНТ — 4.0)
# - knockback-multiplier: множитель отбрасывания игрока от такого взрыва
# - break-blocks: false — взрыв не ломает блоки (урон и отбрасывание остаются)
tnt-hat:
  enabled: true
  name: "ТНТ-шлем"
  lore: "Взрывается при получении урона"
  yield: 4.0
  knockback-multiplier: 2.0
  break-blocks: true

# Запрет полёта на элитрах в огне
fire-elytra:
  enabled: true

# Котёл по-Bedrock: окрашивание брони, очистка флагов и шалкеров
# - ПКМ по котлу с водой с краской → окрасить кожаную броню
# - ПКМ по котлу с водой без краски → очистить окрашенную броню/флаг/шалкер
# - ПКМ по котлу с краской → очистить окрашенную броню
# - Добавление краски: ПКМ по котлу с краской в руке
# - Смывание краски: ПКМ по котлу с цветным блоком/предметом (шерсть/плиты/ступеньки, бетон/плиты/ступеньки, керамика, подушки, мешки, упряжь и т.д.)
# - Ферма мёда: котёл под полным ульём наполняется мёдом каплями
cauldron-bedrock:
  enabled: true
  # Питьё зелья с порохом создаёт небольшой взрыв: ломает ли он блоки
  powder-potion-breaks-blocks: false
  wash-blocks: true
  # 0 отключает лимит. Уже существующие эффекты выше лимита сохраняются.
  potion-max-level: 3
  # Эти эффекты можно усилить до IV при общем лимите III.
  fourth-level-effects: [speed, strength]
  # Предел длительности от редстоуна — 10 минут на эффект.
  # При полной оплате порции шанс размытия растёт линейно с длительностью:
  # 5 минут = 0.05%, 10 минут = 0.1%. 0 отключает риск.
  redstone-max-risk-percent: 0.1
  honey:
    enabled: true
    fill-seconds: 60
    max-levels: 3

# Пересадка попугая с плеча
# - Шифт + ПКМ по блоку пересаживает попугая с плеча на блок
parrot-transplant:
  enabled: true

# Дополнительные зачарования на щите (несовместимы друг с другом)
# - Шипы: атакующий получает урон при блокировке
# - Отдача и Отбрасывание: одинаково откидывают атакующих и снаряды
# - Книга Отдачи/Отбрасывания II повышает щит с II до III, затем до IV и далее
# - Быстрая перезарядка: щит перезаряжается быстрее
# - Работают через наковальню (книга зачарования + щит)
shield-enchant:
  enabled: true

# Отравленные стрелы в ловушке храма джунглей
# - Стрелы, выпущенные диспенсером в храме джунглей, получают эффект яда
jungle-temple-arrows:
  enabled: true

# Стрелы с зельями создают облако эффектов при промахе (как туманные зелья)
tipped-arrows-cloud:
  enabled: true
  # Стрелы с порохом/ветровым зарядом (взрыв при попадании)
  multishot-consumes-three: true  # арбалет с Тройным выстрелом тратит 3 стрелы с зельем/порохом/ветром
  powder-damage: 5.0       # урон взрыва стрелы, одинаковый для прямого попадания и окружающих (защита от взрыва работает)
  powder-knockback: 1.0    # сила толчка от пороха
  wind-knockback: 2.0      # сила толчка ветровой стрелы вдоль полёта (прямое попадание — полная, остальным меньше)
  wind-lift: 0.3           # минимальный подъём вверх при толчке

# Снежные големы замораживают снежками
# - Попадание снежка накладывает эффект заморозки как рыхлый снег
snow-golem-freeze:
  enabled: true

# Проклятье утраты для мешков
# - Мешки можно зачаровать проклятием утраты через наковальню
bundle-vanishing:
  enabled: true

# Шлемы поглощают урон булавы (трезубца)
# - Все шлемы поглощают 25% урона от булавы, теряя прочность
# - Черепаший панцирь поглощает 50% и теряет в 2 раза меньше прочности
turtle-helm-trident:
  enabled: true

# Увеличенный спавн животных (аналог NotEnoughAnimals)
# - При загрузке чанка с шансом spawning-chunk-chance спавнятся животные по правилам биомов.
# - Животные, помеченные плагином, despawn'ятся при выгрузке чанка, если не одомашнены
#   (накормлены, разведены, с поводком, с именем и т.д.).
# - Список spawn-rules: environments (NORMAL/NETHER/THE_END), biomes, on-top-of (материал или #тег), types
# Интеграция с FlectonePulse (https://github.com/Flectone/FlectonePulse)
# - Синхронизация статусов /status с отображением в TAB FlectonePulse
# - Предоставление плейсхолдеров для FlectonePulse (chat, playerlist, scoreboard, motd):
#     %toolkit_status% - идентификатор статуса (streaming, recording, dnd, none)
#     %toolkit_status_name% - название статуса (Стримит, Запись, Не беспокоить, Нет статуса)
#     %toolkit_status_prefix% - цветной префикс (§5● , §c● , §4■ )
#     %toolkit_status_prefix_legacy% - префикс с & (&5● , &c● , &4■ )
#     %toolkit_status_prefix_mm% - MiniMessage префикс (<dark_purple>● </dark_purple>)
#     %toolkit_status_prefix_raw% - символ статуса с пробелом (● , ■ )
#     %toolkit_status_symbol% - символ статуса без пробела (●, ■)
#     %toolkit_status_display% - цветное название (● Стримит)
#     %toolkit_status_display_mm% - цветное название для MiniMessage
#     %toolkit_status_color% - имя цвета (dark_purple, red, dark_red, gray)
#     %toolkit_status_hex% - HEX код цвета (#AA00AA)
#     %toolkit_death_coords% - координаты последней смерти (X Y Z (dimension))
# - Совместная работа HUD (компас и часы работают без помех)
flectonepulse-compat: true

animal-spawning:
  enabled: true
  # Не даём генератору заселять каждый новый чанк большими стаями.
  spawning-chunk-chance: 0.2
  spawn-tries:
    min: 1
    max: 2
  # Максимум всех животных в чанке, включая обычных и приручённых.
  max-per-chunk: 2
  spawn-rules:
    - environments: [NORMAL]
      biomes: [PLAINS, SUNFLOWER_PLAINS]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [COW, SHEEP, PIG, CHICKEN, HORSE, DONKEY]
    - environments: [NORMAL]
      biomes: [FOREST, FLOWER_FOREST, BIRCH_FOREST, OLD_GROWTH_BIRCH_FOREST]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [SHEEP, PIG, CHICKEN, COW, WOLF]
    - environments: [NORMAL]
      biomes: [DARK_FOREST]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [SHEEP, PIG, CHICKEN, COW]
    - environments: [NORMAL]
      biomes: [TAIGA, OLD_GROWTH_PINE_TAIGA, OLD_GROWTH_SPRUCE_TAIGA]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [WOLF, FOX, RABBIT, SHEEP, PIG, CHICKEN, COW]
    - environments: [NORMAL]
      biomes: [SNOWY_TAIGA]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [WOLF, FOX, RABBIT, SHEEP, PIG, CHICKEN, COW]
    - environments: [NORMAL]
      biomes: [SNOWY_PLAINS, SNOWY_SLOPES, ICE_SPIKES]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [POLAR_BEAR, RABBIT, FOX]
    - environments: [NORMAL]
      biomes: [GROVE, FROZEN_PEAKS, JAGGED_PEAKS]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [RABBIT, FOX, GOAT]
    - environments: [NORMAL]
      biomes: [STONY_PEAKS, WINDSWEPT_HILLS, WINDSWEPT_GRAVELLY_HILLS]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [GOAT, SHEEP, LLAMA]
    - environments: [NORMAL]
      biomes: [WINDSWEPT_FOREST]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [SHEEP, PIG, CHICKEN, COW, LLAMA]
    - environments: [NORMAL]
      biomes: [MEADOW]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [DONKEY, SHEEP, RABBIT]
    - environments: [NORMAL]
      biomes: [CHERRY_GROVE]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [SHEEP, PIG, CHICKEN, BEE]
    - environments: [NORMAL]
      biomes: [JUNGLE, BAMBOO_JUNGLE, SPARSE_JUNGLE]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [CHICKEN, OCELOT, PARROT, PANDA]
    - environments: [NORMAL]
      biomes: [SAVANNA, SAVANNA_PLATEAU, WINDSWEPT_SAVANNA]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [HORSE, DONKEY, SHEEP, COW, PIG, CHICKEN]
    - environments: [NORMAL]
      biomes: [DESERT]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [RABBIT]
    - environments: [NORMAL]
      biomes: [SWAMP, MANGROVE_SWAMP]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [FROG]
    - environments: [NORMAL]
      biomes: [MUSHROOM_FIELDS]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [MOOSHROOM]
    - environments: [NORMAL]
      biomes: [BEACH, SNOWY_BEACH, STONY_SHORE]
      on-top-of: ["#ANIMALS_SPAWNABLE_ON"]
      types: [TURTLE]

# Невидимый свет: 4 пыльки светокамня + стекло = 2 факела-источника невидимого света
# - ПКМ в воздухе — изменить уровень яркости (1-15), шифт+ПКМ — уменьшить
# - ПКМ по блоку — поставить невидимый свет с текущим уровнем яркости
light:
  enabled: true
  # Уровень яркости по умолчанию при крафте (1-15)
  default-level: 15
  # Отображаемое имя предмета
  name: "Невидимый свет"

# Обфускация координат (защита от карт/читов по координатам) вынесена в
# отдельный плагин CoordinateOffset — этот плагин больше её не содержит.
# Компас в руке и координаты смерти показывают РЕАЛЬНЫЕ координаты (Bukkit API
# всегда возвращает настоящие координаты мира; смещение применяется только
# в пакетах, уходящих клиенту, и делает его сам CoordinateOffset).

# Координаты смерти
# - При смерти игроку в чат отправляются координаты его смерти
#   (реальные, как у компаса в руке — обфускацией не сдвигаются).
# - Каждый игрок может включить/выключить уведомления отдельно:
#   /deathcoords on / /deathcoords off (настройка запоминается между заходами).
# - /deathcoords (или /deathcoords show) — снова показать координаты последней смерти.
death-coords:
  enabled: false
  # Значение по умолчанию для нового игрока (до его команды on/off)
  default-enabled: true
  message: "☠ Координаты смерти: X: %d, Y: %d, Z: %d (%s)"
  no-death: "У вас ещё нет записи о смерти"
  on: "Уведомления о координатах смерти включены"
  off: "Уведомления о координатах смерти выключены"
  usage: "Использование: /deathcoords <on|off|show>"

# Сообщения (%s = подстановка). Также можно перевести на другие языки
# файлами в lang/ — они берутся из локали игрока.
