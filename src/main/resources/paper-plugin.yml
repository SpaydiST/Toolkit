name: Toolkit
version: '1-0'
main: org.example1.toolkit.Toolkit
bootstrapper: org.example1.toolkit.AchievementBootstrap
api-version: '26.3'
load: POSTWORLD
dependencies:
  server:
    TimeSpeed-plugin:
      load: AFTER
      required: false
    CoordinateOffset:
      load: BEFORE
      required: false
    LibsDisguises:
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
defaultPerm: op
permissions:
  toolkit.reload:
    description: Перезагрузка конфигурации Toolkit
    default: op
